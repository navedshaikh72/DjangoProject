<!DOCTYPE html>
<html>
<head>
    <title>Update User</title>
</head>
<body>
    <h1>Update User</h1>
    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" value="{{ user.email }}" required>
        <input type="password" name="password" value="{{ user.password }}" required>
        <button type="submit">Update</button>
    </form>
</body>
</html>
